# Prefer Bluetooth over ALSA when a BT device is connected.
# Default bluez priority.session is 2010; bumping to 3000 wins against ALSA.
# When no BT is connected, ALSA takes over (bluez nodes don't exist).

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.rules = [
  # Device-level: set bluez monitor props (auto-connect, reconnect profiles).
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect       = [ a2dp_sink hfp_hf ]
        bluez5.reconnect-profiles = [ a2dp_sink hfp_hf ]
      }
    }
  }
  # Node-level: bump priority so any connected BT sink/source beats ALSA.
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]
